<html>
<head>
<title>Registrarse - Nébula</title>
<link rel="stylesheet" href="stylesR.css">
</head>
<body>

<form action="index.html">
<h1>Formulario de registro</h1>
<p>
<label for="usuario">Introduzca nombre de usuario:</label>
<input type="text" id="usuario" placeholder="Ej: noobmaster">
</p>
<p>
<label for="correo">Introduzca correo electrónico:</label>
<input type="email" id="correo" placeholder="usuario@ejemplo.com">
</p>
<p>
<label for="contrasena">Introduzca contraseña:</label>
<input type="password" id="contrasena">
</p>
<p>
<label for="confirmar">Confirme su contraseña:</label>
<input type="password" id="confirmar">
</p>
<p>
<input type="submit" value="Finalizar registro">
</p>
</form>

<p><a href="login.html">¿Ya tienes cuenta? Inicia sesión</a></p>
<p><a href="index.html">Volver a la tienda</a></p>

</body>
</html>
